[package]
name = "helpofai-helpflow"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Typed HelpFlow workflow IR and validation for HelpOfAi"

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[target.'cfg(not(target_env = "ohos"))'.dependencies]
anyhow.workspace = true
starlark = "0.13.0"
# Pin allocative to =0.3.4: starlark_map 0.13.0 uses hashbrown 0.14.x types
# (HashTable, RawTable) that are not Allocative in allocative >= 0.3.5.
allocative = "=0.3.4"

[dev-dependencies]
serde_json.workspace = true
